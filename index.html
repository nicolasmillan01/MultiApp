<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Multi App</h1>
        <p>Dar vida al sitio web utilizando JavaScript.</p>
    </header>

    <main>
        <section>
            <h2>1️⃣ Saludar al Usuario</h2>
            <input type="text" id="input-saludo" placeholder="Escriba su nombre">
            <button id="btn-saludar">Saludar</button>
        </section>

        <section>
            <h2>2️⃣ Cambiar Mensaje</h2>
            <h5>Su mensaje es: </h5>
            <p id="texto-mensaje"></p>
            <input type="text" id="input-mensaje" placeholder="Escriba el texto">
            <button id="btn-cambiar">Cambiar</button>
        </section>

        <section>
            <h2>3️⃣ Contador</h2>
            <p>Contador: <strong id="texto-contador">0</strong></p>
            <input type="text" placeholder="Escriba su nombre">
            <div>
                <button id="btn-sumar">++</button>
                <button id="btn-restar">−−</button>
                <button id="btn-reiniciar">↻</button>
            </div>
        </section>

        <section>
            <h2>4️⃣ Mostrar y Ocultar</h2>
            <img id="imagen-toggle" src="https://picsum.photos/200/300" alt="Imagen aleatoria">
            <div>
                <button id="btn-mostrar">Mostrar</button>
                <button id="btn-ocultar">Ocultar</button>
            </div>
        </section>
    </main>

    <footer>
        <small>Programación en Ambiente Web I · JavaScript + MVC</small>
    </footer>

    <script src="js/model.js"></script>
    <script src="js/controller.js"></script>
</body>

</html>
